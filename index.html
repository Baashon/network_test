<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест: настройки сети</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1220;
    --bg-card:#101b30;
    --bg-card-2:#0d1626;
    --accent:#22d3ee;
    --accent-dim:#0e7490;
    --amber:#fbbf24;
    --danger:#f87171;
    --text:#e7edf7;
    --text-muted:#7d8ea6;
    --border:rgba(148,178,214,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(34,211,238,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(34,211,238,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
  }
  .wrap{width:100%;max-width:640px;}

  .pulse-track{
    position:relative;
    height:6px;
    border-radius:3px;
    background:rgba(148,178,214,0.12);
    margin-bottom:10px;
    overflow:hidden;
  }
  .pulse-fill{
    position:absolute;left:0;top:0;bottom:0;
    background:linear-gradient(90deg,var(--accent-dim),var(--accent));
    border-radius:3px;
    transition:width .5s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 12px rgba(34,211,238,0.6);
  }
  .pulse-dot{
    position:absolute;top:50%;width:10px;height:10px;
    background:var(--accent);
    border-radius:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 8px 3px rgba(34,211,238,0.7);
    transition:left .5s cubic-bezier(.4,0,.2,1);
  }
  .meta-row{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;color:var(--text-muted);
    letter-spacing:.03em;
    margin-bottom:28px;
    gap:12px;
  }
  .meta-row b{color:var(--accent);font-weight:500;}
  .timer-pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px;border-radius:20px;
    background:rgba(34,211,238,0.08);
    border:1px solid rgba(34,211,238,0.25);
    color:var(--accent);
    font-size:12px;flex:none;
    transition:background .3s, border-color .3s, color .3s;
  }
  .timer-pill.warn{background:rgba(251,191,36,0.1);border-color:rgba(251,191,36,0.35);color:var(--amber);}
  .timer-pill.danger{background:rgba(248,113,113,0.12);border-color:rgba(248,113,113,0.4);color:var(--danger);}
  .timer-dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;}

  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin-bottom:10px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:30px;font-weight:700;margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  p.sub{color:var(--text-muted);font-size:15px;line-height:1.55;margin:0 0 28px;}

  .card{
    background:linear-gradient(180deg,var(--bg-card),var(--bg-card-2));
    border:1px solid var(--border);
    border-radius:16px;
    padding:28px;
  }

  input[type=text]{
    width:100%;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:16px;
    padding:14px 16px;
    border-radius:10px;
    outline:none;
    transition:border-color .2s;
  }
  input[type=text]:focus{border-color:var(--accent);}
  label.field-label{
    display:block;font-size:13px;color:var(--text-muted);margin-bottom:8px;
    font-family:'IBM Plex Mono',monospace;
  }

  .role-grid{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .role-option{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 16px;
    background:rgba(255,255,255,0.02);
    border:1px solid var(--border);
    border-radius:10px;
    cursor:pointer;
    font-size:14.5px;
    transition:border-color .15s, background .15s;
  }
  .role-option:hover{border-color:rgba(34,211,238,0.35);background:rgba(34,211,238,0.04);}
  .role-option.selected{border-color:var(--accent);background:rgba(34,211,238,0.08);}
  .role-option .rq-count{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-muted);flex:none;
  }
  .role-option.selected .rq-count{color:var(--accent);}

  button{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;font-size:15px;
    border:none;border-radius:10px;
    padding:14px 22px;
    cursor:pointer;
    transition:transform .15s, box-shadow .15s, background .15s;
  }
  button:active{transform:scale(0.98);}
  .btn-primary{
    background:var(--accent);color:#052730;
    box-shadow:0 4px 20px rgba(34,211,238,0.25);
  }
  .btn-primary:hover{box-shadow:0 6px 26px rgba(34,211,238,0.4);}
  .btn-primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
  .btn-ghost{
    background:transparent;color:var(--text-muted);
    border:1px solid var(--border);
  }
  .btn-ghost:hover{color:var(--text);border-color:rgba(148,178,214,0.3);}

  .q-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;color:var(--accent);letter-spacing:.08em;
    margin-bottom:12px;
  }
  .q-text{
    font-family:'Space Grotesk',sans-serif;
    font-size:19px;font-weight:600;line-height:1.4;
    margin-bottom:22px;
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;
    background:rgba(255,255,255,0.02);
    border:1px solid var(--border);
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    transition:border-color .15s, background .15s;
  }
  .option:hover{border-color:rgba(34,211,238,0.35);background:rgba(34,211,238,0.04);}
  .option.selected{border-color:var(--accent);background:rgba(34,211,238,0.08);}
  .option.correct{border-color:#34d399;background:rgba(52,211,153,0.1);}
  .option.incorrect{border-color:var(--danger);background:rgba(248,113,113,0.1);}
  .option-letter{
    width:26px;height:26px;flex:none;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:12px;
    background:rgba(255,255,255,0.06);color:var(--text-muted);
  }
  .option.selected .option-letter{background:var(--accent);color:#052730;}
  .option.correct .option-letter{background:#34d399;color:#052730;}
  .option.incorrect .option-letter{background:var(--danger);color:#450a0a;}

  .footer-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:26px;
  }

  .explain{
    margin-top:16px;padding:14px 16px;
    background:rgba(255,255,255,0.03);
    border-left:2px solid var(--accent);
    border-radius:0 8px 8px 0;
    font-size:13.5px;color:var(--text-muted);line-height:1.5;
  }

  .score-big{
    font-family:'Space Grotesk',sans-serif;
    font-size:64px;font-weight:700;
    line-height:1;
    background:linear-gradient(180deg,var(--text),var(--text-muted));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .score-label{color:var(--text-muted);font-size:14px;margin-top:6px;}
  .verdict{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;font-weight:600;margin-top:18px;
  }
  .review-item{
    padding:14px 0;border-top:1px solid var(--border);
    font-size:14px;
  }
  .review-item .rq{color:var(--text);margin-bottom:6px;font-weight:500;}
  .review-item .ra{color:var(--text-muted);}
  .tag{
    display:inline-block;font-family:'IBM Plex Mono',monospace;
    font-size:10px;padding:2px 8px;border-radius:20px;margin-right:8px;
  }
  .tag.ok{background:rgba(52,211,153,0.15);color:#34d399;}
  .tag.no{background:rgba(248,113,113,0.15);color:var(--danger);}

  .admin-list{margin-top:16px;display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;}
  .admin-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 14px;background:rgba(255,255,255,0.02);
    border:1px solid var(--border);border-radius:8px;font-size:14px;
    gap:10px;
  }
  .admin-row .name{font-weight:500;}
  .admin-row .role{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);margin-top:2px;}
  .admin-row .when{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-muted);margin-top:2px;}
  .admin-score{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent);flex:none;}

  .top-link{
    background:none;border:none;color:var(--text-muted);
    font-family:'IBM Plex Mono',monospace;font-size:12px;
    cursor:pointer;text-decoration:underline;text-underline-offset:3px;
    padding:0;
  }
  .top-link:hover{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const ROLES = [{"id": "general", "title": "Общий тест: базовые настройки сети", "questions": [{"q": "У вас подсеть 192.168.10.0/26. Сколько адресов доступно для хостов в этой подсети?", "options": ["30", "62", "64", "126"], "correct": 1}, {"q": "Порт коммутатора перешёл в статус «err-disabled» сразу после подключения кабеля клиента. Что нужно сделать в первую очередь?", "options": ["Немедленно заменить коммутатор", "Выяснить причину блокировки (например, срабатывание port security или BPDU guard) и устранить её перед повторным включением порта", "Перезагрузить весь сегмент сети", "Сменить IP-адрес клиента"], "correct": 1}, {"q": "Верно ли утверждение: «HTTP по умолчанию использует порт 443»?", "options": ["Верно", "Неверно — HTTP использует порт 80, порт 443 закреплён за HTTPS", "Верно, но только для IPv6-сетей", "Неверно, порт 443 используется только FTP"], "correct": 1}, {"q": "Какой из перечисленных портов НЕ относится к протоколам электронной почты?", "options": ["25 (SMTP)", "110 (POP3)", "53 (DNS)", "143 (IMAP)"], "correct": 2}, {"q": "Какой префикс CIDR (/xx) соответствует маске 255.255.255.192?", "options": ["/24", "/25", "/26", "/27"], "correct": 2}, {"q": "Клиент в отдельном VLAN не получает IP-адрес по DHCP, хотя сервер DHCP работает исправно в другой подсети. Что нужно проверить в первую очередь?", "options": ["Настроен ли DHCP relay (ip helper-address) на маршрутизаторе между VLAN", "Версию прошивки клиентского ноутбука", "Цвет патч-корда", "Пароль Wi-Fi точки доступа"], "correct": 0}, {"q": "Какой диапазон адресов относится к приватным (внутренним) сетям согласно RFC 1918?", "options": ["10.0.0.0 – 10.255.255.255", "172.15.0.0 – 172.30.255.255", "192.169.0.0 – 192.169.255.255", "11.0.0.0 – 11.255.255.255"], "correct": 0}, {"q": "При выполнении traceroute до внешнего сайта пакеты успешно доходят до шлюза провайдера, но дальше нет ответа. О чём это может говорить?", "options": ["Проблема находится за пределами вашей локальной сети — на стороне провайдера или дальше по маршруту", "Неправильно настроен DHCP", "Сломан кабель на рабочем месте пользователя", "Неверно указан MAC-адрес компьютера"], "correct": 0}, {"q": "Верно ли, что NAT позволяет нескольким устройствам с приватными IP-адресами выходить в интернет через один публичный адрес?", "options": ["Верно", "Неверно, NAT используется только для шифрования", "Неверно, для этого нужен только DNS", "Верно, но только в IPv6"], "correct": 0}, {"q": "Сколько адресов хостов вмещает подсеть с маской /28?", "options": ["16", "14", "30", "8"], "correct": 1}, {"q": "Ноутбук подключили к коммутатору патч-кордом, порт активен и не в err-disabled, но индикатор сетевой карты не горит и соединения нет. Наиболее вероятная причина?", "options": ["Неисправность кабеля или сетевого интерфейса либо несовпадение скорости/дуплекса", "Неверно указан пароль Wi-Fi", "Слишком длинный DNS suffix", "Клиент использует IPv6 вместо IPv4"], "correct": 0}, {"q": "Какое из устройств НЕ работает на канальном (L2) уровне модели OSI?", "options": ["Коммутатор (switch)", "Мост (bridge)", "Маршрутизатор (router)", "Точка доступа Wi-Fi в режиме моста"], "correct": 2}, {"q": "Для чего используется VLAN в сети предприятия?", "options": ["Для логической изоляции групп устройств в пределах одной физической инфраструктуры", "Для увеличения физической длины кабеля", "Для замены протокола DNS", "Для автоматического обновления прошивки коммутатора"], "correct": 0}, {"q": "Сотрудник не может зайти на внутренний портал по HTTPS, при этом остальные сайты открываются нормально. Что стоит проверить в первую очередь?", "options": ["Доступность порта 443 до сервера портала и корректность сертификата/DNS-записи для этого домена", "Скорость Wi-Fi роутера", "Настройки VLAN на его коммутаторе доступа", "Версию Bluetooth на устройстве"], "correct": 0}, {"q": "Верно ли, что модель OSI состоит из 7 уровней?", "options": ["Верно", "Неверно, из 5 уровней", "Неверно, из 4 уровней", "Верно, но только для IPv6"], "correct": 0}, {" const QUIZ_TIME_LIMIT = 30 * 60; // 30 минут

let state = {
  screen: 'start',   // start | quiz | result | admin
  name: '',
  roleIdx: null,
  current: 0,
  answers: [],
  timerSeconds: QUIZ_TIME_LIMIT,
  timerHandle: null
};

function stopTimer(){
  if(state.timerHandle){
    clearInterval(state.timerHandle);
    state.timerHandle = null;
  }
}

function startTimer(){
  stopTimer();
  state.timerSeconds = QUIZ_TIME_LIMIT;
  updateTimerUI();
  state.timerHandle = setInterval(() => {
    state.timerSeconds--;
    if(state.timerSeconds <= 0){
      state.timerSeconds = 0;
      updateTimerUI();
      stopTimer();
      autoFinishQuiz();
      return;
    }
    updateTimerUI();
  }, 1000);
}

function formatTime(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function updateTimerUI(){
  const el = document.getElementById('timerPill');
  const val = document.getElementById('timerVal');
  if(!val || !el) return;
  val.textContent = formatTime(state.timerSeconds);
  el.classList.remove('warn','danger');
  if(state.timerSeconds <= 60) el.classList.add('danger');
  else if(state.timerSeconds <= 5*60) el.classList.add('warn');
}

async function autoFinishQuiz(){
  const qs = currentRole().questions;
  for(let i = 0; i < qs.length; i++){
    if(state.answers[i] === undefined){
      state.answers[i] = { selected: -1, correct: false };
    }
  }
  const correctCount = state.answers.filter(a => a.correct).length;
  const record = {
    name: state.name,
    role: currentRole().title,
    score: correctCount,
    total: qs.length,
    date: new Date().toISOString(),
    timedOut: true
  };
  try{
    await window.storage.set('result:' + Date.now() + '-' + Math.random().toString(36).slice(2,7), JSON.stringify(record), true);
  }catch(e){ console.error('Storage error', e); }
  state.timedOut = true;
  state.screen = 'result';
  render();
}

function currentRole(){ return ROLES[state.roleIdx]; }

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'start') app.innerHTML = renderStart();
  else if(state.screen === 'quiz') app.innerHTML = renderQuiz();
  else if(state.screen === 'result') app.innerHTML = renderResult();
  else if(state.screen === 'admin') app.innerHTML = renderAdmin();
  attachHandlers();
}

function renderStart(){
  const roleOptions = ROLES.map((r, idx) => `
    <div class="role-option ${state.roleIdx === idx ? 'selected' : ''}" data-role-idx="${idx}">
      <span>${escapeHtml(r.title)}</span>
      <span class="rq-count">${r.questions.length} вопросов</span>
    </div>
  `).join('');

  return `
    <div class="eyebrow">Внутренняя аттестация · Сеть</div>
    <h1>Тест на знание настроек сети</h1>
    <p class="sub">Выберите должность и укажите имя. Каждая должность проходит свой набор вопросов — результат сохраняется автоматически.</p>
    <div class="card">
      <label class="field-label">ФИО СОТРУДНИКА</label>
      <input type="text" id="nameInput" placeholder="Например, Аскар Ермеков" value="${escapeHtml(state.name)}" />

      <label class="field-label" style="margin-top:20px;">ДОЛЖНОСТЬ / НАБОР ВОПРОСОВ</label>
      <div class="role-grid">${roleOptions}</div>

      <div class="footer-row">
        <button class="btn-ghost" id="adminBtn">Результаты сотрудников</button>
        <button class="btn-primary" id="startBtn">Начать тест</button>
      </div>
    </div>
  `;
}

function renderQuiz(){
  const role = currentRole();
  const qs = role.questions;
  const i = state.current;
  const q = qs[i];
  const answered = state.answers[i] !== undefined;
  const pct = ((i) / qs.length) * 100;
  const dotPct = ((i + (answered?1:0)) / qs.length) * 100;

  let optionsHtml = q.options.map((opt, idx) => {
    let cls = 'option';
    if(answered){
      if(idx === q.correct) cls += ' correct';
      else if(idx === state.answers[i].selected) cls += ' incorrect';
    }
    return `<div class="${cls}" data-idx="${idx}">
      <span class="option-letter">${String.fromCharCode(65+idx)}</span>
      <span>${escapeHtml(opt)}</span>
    </div>`;
  }).join('');

  return `
    <div class="pulse-track">
      <div class="pulse-fill" style="width:${pct}%"></div>
      <div class="pulse-dot" style="left:${dotPct}%"></div>
    </div>
    <div class="meta-row">
      <span>${escapeHtml(role.title)} · ВОПРОС <b>${i+1}</b> ИЗ ${qs.length}</span>
      <span class="timer-pill" id="timerPill"><span class="timer-dot"></span><span id="timerVal">${formatTime(state.timerSeconds)}</span></span>
    </div>
    <div class="card">
      <div class="q-num">Q${i+1} · ${escapeHtml(state.name)}</div>
      <div class="q-text">${escapeHtml(q.q)}</div>
      <div class="options">${optionsHtml}</div>
      <div class="footer-row">
        <span></span>
        <button class="btn-primary" id="nextBtn" ${answered ? '' : 'disabled'}>
          ${i === qs.length - 1 ? 'Завершить тест' : 'Следующий вопрос'}
        </button>
      </div>
    </div>
  `;
}

function renderResult(){
  const role = currentRole();
  const qs = role.questions;
  const total = qs.length;
  const correctCount = state.answers.filter(a => a.correct).length;
  const pct = Math.round((correctCount/total)*100);
  let verdict, color;
  if(pct >= 85){ verdict = 'Отличный уровень'; color = '#34d399'; }
  else if(pct >= 60){ verdict = 'Хороший результат, есть пробелы'; color = 'var(--amber)'; }
  else { verdict = 'Стоит повторить материал'; color = 'var(--danger)'; }

  const reviewHtml = qs.map((q,i) => {
    const a = state.answers[i];
    const yourAnswer = (a.selected === -1 || a.selected === undefined) ? 'нет ответа (время истекло)' : escapeHtml(q.options[a.selected]);
    return `<div class="review-item">
      <div class="rq"><span class="tag ${a.correct?'ok':'no'}">${a.correct?'ВЕРНО':'НЕВЕРНО'}</span>${escapeHtml(q.q)}</div>
      <div class="ra">Ваш ответ: ${yourAnswer}${a.correct ? '' : ' · Правильный: ' + escapeHtml(q.options[q.correct])}</div>
    </div>`;
  }).join('');

  return `
    <div class="eyebrow">${escapeHtml(role.title)}</div>
    <h1>${escapeHtml(state.name)}</h1>
    ${state.timedOut ? '<p class="sub" style="color:var(--danger);margin:-16px 0 20px;">Время теста (30 минут) истекло — тест завершён автоматически, неотвеченные вопросы засчитаны как неверные.</p>' : ''}
    <div class="card" style="text-align:center;padding:36px 28px;">
      <div class="score-big">${correctCount}/${total}</div>
      <div class="score-label">правильных ответов · ${pct}%</div>
      <div class="verdict" style="color:${color}">${verdict}</div>
    </div>
    <div class="card" style="margin-top:16px;">
      ${reviewHtml}
    </div>
    <div class="footer-row">
      <button class="btn-ghost" id="adminBtn2">Все результаты</button>
      <button class="btn-primary" id="restartBtn">Пройти ещё раз</button>
    </div>
  `;
}

function renderAdmin(){
  return `
    <div class="eyebrow">Просмотр · Только для администратора</div>
    <h1>Результаты сотрудников</h1>
    <p class="sub">Список всех пройденных тестов по всем должностям, сохранённых на этом сайте.</p>
    <div class="card">
      <div id="adminContent"><span class="score-label">Загрузка…</span></div>
    </div>
    <div class="footer-row">
      <span></span>
      <button class="btn-ghost" id="backBtn">← Назад</button>
    </div>
  `;
}

async function loadAdminResults(){
  const container = document.getElementById('adminContent');
  try{
    const list = await window.storage.list('result:', true);
    if(!list || !list.keys || list.keys.length === 0){
      container.innerHTML = '<span class="score-label">Пока никто не прошёл тест.</span>';
      return;
    }
    const items = [];
    for(const key of list.keys){
      try{
        const r = await window.storage.get(key, true);
        if(r && r.value) items.push(JSON.parse(r.value));
      }catch(e){}
    }
    items.sort((a,b) => new Date(b.date) - new Date(a.date));
    container.innerHTML = `<div class="admin-list">` + items.map(it => `
      <div class="admin-row">
        <div>
          <div class="name">${escapeHtml(it.name)}</div>
          <div class="role">${escapeHtml(it.role || '')}</div>
          <div class="when">${new Date(it.date).toLocaleString('ru-RU')}</div>
        </div>
        <div class="admin-score">${it.score}/${it.total}</div>
      </div>
    `).join('') + `</div>`;
  }catch(e){
    container.innerHTML = '<span class="score-label">Не удалось загрузить результаты.</span>';
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function attachHandlers(){
  const nameInput = document.getElementById('nameInput');
  if(nameInput){
    nameInput.addEventListener('input', e => state.name = e.target.value);
  }

  document.querySelectorAll('.role-option').forEach(opt => {
    opt.addEventListener('click', () => {
      state.roleIdx = parseInt(opt.getAttribute('data-role-idx'));
      render();
      document.getElementById('nameInput').focus();
    });
  });

  const startBtn = document.getElementById('startBtn');
  if(startBtn){
    startBtn.addEventListener('click', () => {
      const nameVal = document.getElementById('nameInput');
      if(!state.name.trim()){
        nameVal.style.borderColor = 'var(--danger)';
        nameVal.focus();
        return;
      }
      if(state.roleIdx === null){
        document.querySelectorAll('.role-option').forEach(el => el.style.borderColor = 'var(--danger)');
        return;
      }
      state.screen = 'quiz';
      state.current = 0;
      state.answers = [];
      state.timedOut = false;
      render();
      startTimer();
    });
  }
  const adminBtn = document.getElementById('adminBtn') || document.getElementById('adminBtn2');
  if(adminBtn){
    adminBtn.addEventListener('click', () => {
      stopTimer();
      state.screen = 'admin';
      render();
      loadAdminResults();
    });
  }
  const backBtn = document.getElementById('backBtn');
  if(backBtn){
    backBtn.addEventListener('click', () => {
      state.screen = 'start';
      render();
    });
  }

  document.querySelectorAll('.option').forEach(opt => {
    opt.addEventListener('click', () => {
      const i = state.current;
      if(state.answers[i] !== undefined) return;
      const idx = parseInt(opt.getAttribute('data-idx'));
      const qs = currentRole().questions;
      state.answers[i] = { selected: idx, correct: idx === qs[i].correct };
      render();
    });
  });

  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn){
    nextBtn.addEventListener('click', async () => {
      const qs = currentRole().questions;
      if(state.current < qs.length - 1){
        state.current++;
        render();
      } else {
        stopTimer();
        const correctCount = state.answers.filter(a => a.correct).length;
        const record = {
          name: state.name,
          role: currentRole().title,
          score: correctCount,
          total: qs.length,
          date: new Date().toISOString()
        };
        try{
          await window.storage.set('result:' + Date.now() + '-' + Math.random().toString(36).slice(2,7), JSON.stringify(record), true);
        }catch(e){ console.error('Storage error', e); }
        state.screen = 'result';
        render();
      }
    });
  }

  const restartBtn = document.getElementById('restartBtn');
  if(restartBtn){
    restartBtn.addEventListener('click', () => {
      stopTimer();
      state = { screen: 'start', name: '', roleIdx: null, current: 0, answers: [], timerSeconds: QUIZ_TIME_LIMIT, timerHandle: null };
      render();
    });
  }
}

render();
</script>
</body>
</html>
